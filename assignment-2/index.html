<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Engine - Men's Wear Clone</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md navbar-light sticky-top custom-navbar">
      <div class="container-fluid d-flex align-items-center px-4">
        <button
          class="navbar-toggler d-md-none border-0 order-1"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#mobileMenu"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <a
          class="navbar-brand custom-brand fw-medium m-0 order-2 text-uppercase"
          href="#"
          >Engine</a
        >

        <div class="d-flex align-items-center gap-3 order-3">
          <a href="#" class="text-dark text-decoration-none">🔍</a>
          <a href="#" class="text-dark text-decoration-none">🛒</a>
        </div>

        <div
          class="collapse navbar-collapse order-4 order-md-1"
          id="mobileMenu"
        >
          <ul class="navbar-nav fw-semibold gap-md-2">
            <li class="nav-item">
              <a class="nav-link" href="#">New In</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Tops</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Bottoms</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Suits</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <script>
      const navbar = document.querySelector(".custom-navbar");

      function updateNavbar() {
        navbar.classList.toggle("scrolled", window.scrollY > 0);
      }

      window.addEventListener("scroll", updateNavbar);
      updateNavbar();
    </script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
